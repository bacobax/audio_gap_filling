model:
  emb_dim: 768
  encoder_layer: 2
  encoder_head: 4
  decoder_layer: 2
  decoder_head: 4
  pretrained_ViT: true
  patch_size: 4
training:
  seed: 42
  batch_size: 32
  max_device_batch_size: 512
  base_learning_rate: 0.0005
  weight_decay: 0.05
  mask_ratio: 0.25
  total_epoch: 15
  warmup_epoch: 1
  l1_weight: 0.1
  use_muon: false
  resume: false
paths:
  model_path: vit-t-mae.pt
  audio_filename: assets/gapped_audio.wav
  test_audio_filename: assets/wav_test.wav
  
# Data settings
data:
  n_mels: 80
