model:
  type: diffusion_unet
  network:
    emb_dim: 256
    use_norm: true
    use_fencoding: true
    cqt:
      num_octs: 6
      bins_per_oct: 8
      window: hann
      beta: 8.6
    Ns: [8, 16, 32, 64, 128, 256]
    Ss: [1, 1, 1, 1, 1, 1]
    num_dils: [1, 1, 2, 2, 4, 4]
    attention_layers: [0, 0, 0, 0, 0, 0]
    attention_dict:
      num_heads: 4
      bias_qkv: false
      use_rel_pos: false
      rel_pos_num_buckets: 8
      rel_pos_max_distance: 64
    bottleneck_type: res_dil_convs
    num_bottleneck_layers: 2
training:
  trainer_type: diffusion
  batch_size: 2
  total_epoch: 1
  lr: 0.0002
  use_grad_clip: true
  max_grad_norm: 1.0

diff_params:
  sigma_min: 0.002
  sigma_max: 80
  P_mean: -1.2
  P_std: 1.2
  ro: 7
  ro_train: 1
  sigma_data: 0.5
  Schurn: 0
  Stmin: 0
  Stmax: 999
  Snoise: 1
  aweighting:
    use_aweighting: false
    ntaps: 101

data:
  dataset_type: audio_folder
  folder: assets
  sample_rate: 16000
  segment_length: 65536
